[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rp-llm"
version = "0.1.0"
description = "Simulation-only RP-LLM prototype"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2",
  "numpy>=1.26",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "networkx>=3.2",
  "hydra-core>=1.3",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
llm = ["transformers>=4.45", "torch>=2.2", "huggingface_hub>=0.24"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
